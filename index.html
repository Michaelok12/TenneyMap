<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jaxxa Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg-dark:#1c1712; --parchment:#efe2c4; --parchment-2:#e3d2ae; --ink:#2c2419;
  --accent:#6c3f1f; --panel-shadow:0 10px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:linear-gradient(180deg,#241b13,#1a1410);color:var(--ink)}
#app{display:flex;height:100vh;width:100vw;overflow:hidden}
#mapPanel{flex:1;overflow:auto;background:#2a2118;padding:20px;cursor:grab}
#mapPanel.dragging{cursor:grabbing;user-select:none}
#zoomStage{position:relative;margin:0 auto}
#mapWrap{position:absolute;left:0;top:0;transform-origin:top left;box-shadow:0 18px 36px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.10)}
#mapImg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;user-select:none;pointer-events:none}
#territorySvg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.territory-label{position:absolute;transform:translate(-50%,-50%);background:rgba(239,226,196,.88);border:1px solid rgba(70,54,35,.55);border-radius:10px;padding:5px 10px;font-size:12px;font-weight:700;text-align:center;pointer-events:none;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.poi{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;border:2px solid #24180f;z-index:10;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.poi.selected,.pc-quest.selected{outline:3px solid rgba(255,255,255,.95);outline-offset:2px}
.poi-inner{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:rgba(255,255,255,.88);border-radius:50%;overflow:hidden}
.poi-inner img{max-width:21px;max-height:21px}
.linked-map-badge{position:absolute;right:-7px;top:-7px;width:17px;height:17px;border-radius:50%;border:1px solid #2d2218;background:#f7d56a;color:#2d2218;font-size:12px;line-height:15px;text-align:center;font-weight:bold;box-shadow:0 2px 5px rgba(0,0,0,.45);pointer-events:none}
.party-location{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;border:4px solid #00c853;box-shadow:0 0 0 2px rgba(15,45,25,.75),0 0 12px rgba(0,200,83,.65);background:transparent;z-index:2;pointer-events:none}
.pc-quest{position:absolute;transform:translate(-50%,-100%);width:40px;height:52px;z-index:12;cursor:pointer;border:0;background:transparent;padding:0}
.pc-quest-pin{position:relative;display:block;width:40px;height:52px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.55))}
.pc-quest-shape{position:absolute;left:50%;top:2px;width:34px;height:42px;transform:translateX(-50%);clip-path:polygon(50% 100%,16% 58%,8% 36%,13% 19%,27% 7%,50% 2%,73% 7%,87% 19%,92% 36%,84% 58%);background:#6f4cc3}
.pc-quest-icon{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:#f5efe2;border:1px solid #2d2218;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#2d2218;font-size:10px;font-weight:bold}
.pc-quest-icon img{max-width:18px;max-height:18px;object-fit:contain}
#infoPanel{width:390px;min-width:330px;max-width:44vw;background:linear-gradient(180deg,var(--parchment),var(--parchment-2));border-left:2px solid rgba(60,44,26,.45);box-shadow:var(--panel-shadow);display:flex;flex-direction:column;z-index:80}
#infoPanel.collapsed{display:none}
#poiBrowser{flex:0 0 34%;max-height:38%;min-height:245px;border-bottom:1px solid rgba(83,63,40,.35);background:rgba(94,66,36,.07);padding:12px;display:flex;flex-direction:column;gap:7px}
#detailsPane{flex:1 1 auto;min-height:0;padding:16px 18px;overflow-y:auto}
.player-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#745c3d;font-weight:bold;margin-bottom:8px}
#detailsPane h1{font-size:24px;margin:0 0 10px;color:#2f2317}
.browser-topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.browser-title{font-weight:bold;color:#3f3122}
#poiCount{font-size:11px;color:#6d563a}
#poiSearch,#mapSelector{width:100%;padding:7px 8px;border:1px solid #ab9576;border-radius:8px;background:rgba(255,250,241,.92);color:var(--ink);font-family:inherit}
.map-selector-row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
#upLayerButton{
  border:1px solid rgba(60,44,26,.45);
  background:linear-gradient(180deg,#fff7ea,#ead9b7);
  border-radius:8px;
  padding:7px 9px;
  cursor:pointer;
  font-weight:bold;
  color:#3a2a1c;
  font-family:inherit;
  white-space:nowrap;
}
#upLayerButton:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative}
.filter-dropdown{position:relative}
.filter-button{width:100%;padding:7px 8px;border:1px solid #ab9576;border-radius:8px;font-size:12px;background:rgba(255,250,241,.92);color:var(--ink);font-family:inherit;text-align:left;cursor:pointer}
.filter-button::after{content:"▾";float:right;opacity:.75}
.filter-menu{display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:210px;max-height:300px;overflow-y:auto;z-index:300;background:rgba(255,250,241,.98);border:1px solid #ab9576;border-radius:10px;box-shadow:0 8px 18px rgba(0,0,0,.28);padding:7px}
.filter-dropdown.open .filter-menu{display:block}
.filter-dropdown:last-child .filter-menu{right:0;left:auto}
.filter-menu-actions{display:flex;gap:5px;margin-bottom:6px}
.filter-menu-actions button,.filter-close{flex:1;border:1px solid rgba(109,85,58,.35);border-radius:7px;background:rgba(239,226,196,.85);color:#3f3122;font-family:inherit;font-size:11px;padding:4px 5px;cursor:pointer}
.filter-option{display:flex;align-items:center;gap:6px;padding:4px 3px;font-size:12px;cursor:pointer;user-select:none}
.filter-close{width:100%;margin-top:6px}
#poiList{flex:1 1 auto;min-height:0;overflow-y:auto;border:1px solid rgba(140,117,82,.55);border-radius:10px;background:rgba(255,251,244,.42);padding:6px}
.poi-list-item{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;padding:7px;border-radius:9px;cursor:pointer}
.poi-list-item:hover,.poi-list-item.active{background:rgba(108,63,31,.16)}
.poi-list-icon{width:30px;height:30px;border-radius:50%;border:1px solid rgba(40,30,20,.7);display:flex;align-items:center;justify-content:center}
.poi-list-icon-inner{width:22px;height:22px;background:rgba(255,255,255,.86);border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.poi-list-main-img{max-width:18px;max-height:18px}
.poi-list-title{font-weight:bold;font-size:13px}
.poi-list-meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.list-tag,.badge{font-size:11px;background:rgba(255,255,255,.48);border:1px solid rgba(109,85,58,.25);border-radius:999px;padding:2px 6px;display:inline-flex;align-items:center;gap:4px}
.poi-list-spacer{height:8px}
.poi-list-header{padding:6px 8px 5px;margin:3px 0 5px;border-top:1px solid rgba(109,85,58,.32);color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:12px}
.badge-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px;align-items:center}
.badge-row button{
  border:1px solid rgba(60,44,26,.45);
  background:linear-gradient(180deg,#fff7ea,#ead9b7);
  border-radius:999px;
  padding:3px 8px;
  cursor:pointer;
  font-weight:bold;
  color:#3a2a1c;
  font-family:inherit;
  font-size:11px;
}
.poi-header{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;margin-bottom:6px}
.poi-header-icon{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.72);border:1px solid rgba(55,42,28,.35);display:flex;align-items:center;justify-content:center;overflow:hidden}
.poi-header-icon img{max-width:26px;max-height:26px}
.badge img{
  width:16px;
  height:16px;
  max-width:16px;
  max-height:16px;
  object-fit:contain;
  vertical-align:middle;
}
.faction-chip-dot,.color-dot{font-size:15px;line-height:1}
#controls{position:fixed;left:16px;top:16px;display:flex;align-items:center;gap:6px;background:rgba(239,226,196,.92);border:1px solid rgba(60,44,26,.42);border-radius:10px;padding:8px;z-index:120;box-shadow:var(--panel-shadow)}
#controls button,#toggleSidebarButton,#toggleLegendButton{border:1px solid rgba(60,44,26,.45);background:linear-gradient(180deg,#fff7ea,#ead9b7);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:bold;color:#3a2a1c;font-family:inherit}
#bottomControls{position:fixed;right:16px;bottom:16px;z-index:110;display:flex;gap:8px;align-items:center}
.legend{position:fixed;left:16px;bottom:16px;background:rgba(239,226,196,.94);border:1px solid rgba(60,44,26,.42);border-radius:12px;padding:10px 12px;font-size:12px;max-width:520px;z-index:100;box-shadow:var(--panel-shadow)}
.legend.hidden{display:none}
.legend-title{font-weight:bold;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-size:11px;margin-bottom:5px}
.legend-grid,.legend-factions{display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:6px}
.legend-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
.legend-icon{width:18px;height:18px;object-fit:contain}
</style>
</head>
<body>
<div id="app">
  <main id="mapPanel">
    <div id="zoomStage"><div id="mapWrap"><img id="mapImg" alt="Campaign map"><svg id="territorySvg"></svg></div></div>
  </main>
  <aside id="infoPanel">
    <div id="poiBrowser">
      <div class="browser-topbar"><div class="browser-title">Atlas</div><div id="poiCount"></div></div>
      <div class="map-selector-row">
        <select id="mapSelector"></select>
        <button id="upLayerButton" type="button" title="Open parent map">Up</button>
      </div>
      <input id="poiSearch" type="search" placeholder="Search this map...">
      <div class="filter-row">
        <div class="filter-dropdown" id="categoryFilterDropdown"><button type="button" class="filter-button" id="categoryFilterButton">Categories: All</button><div class="filter-menu" id="categoryFilterMenu"></div></div>
        <div class="filter-dropdown" id="factionFilterDropdown"><button type="button" class="filter-button" id="factionFilterButton">Factions: All</button><div class="filter-menu" id="factionFilterMenu"></div></div>
      </div>
      <div id="poiList"></div>
    </div>
    <div id="detailsPane"><div class="player-title">Jaxxa Map</div><h1>Map Information</h1><p>Choose a map, click a marker, or choose an item from the list.</p></div>
  </aside>
</div>
<div id="controls"><button onclick="zoomBy(1.15)">+</button><button onclick="zoomBy(1/1.15)">−</button><button onclick="resetZoom()">Reset</button><span id="zoomLabel">100%</span></div>
<div id="bottomControls"><button id="toggleSidebarButton" type="button" onclick="toggleSidebar()">Hide Sidebar</button><button id="toggleLegendButton" type="button" onclick="toggleLegend()">Hide Legend</button></div>
<div class="legend" id="mapLegend"><div class="legend-title">Categories</div><div class="legend-grid" id="categoryLegend"></div><div class="legend-title">Faction Colors</div><div class="legend-factions" id="factionLegend"></div></div>

function toggleLegend(){legendCollapsed=!legendCollapsed;mapLegend.classList.toggle("hidden",legendCollapsed);toggleLegendButton.textContent=legendCollapsed?"Show Legend":"Hide Legend"}
mapPanel.addEventListener("wheel",e=>{e.preventDefault();const prev=zoom;zoom=Math.min(4,Math.max(.35,zoom*(e.deltaY<0?1.12:1/1.12)));applyZoom(e.clientX,e.clientY,prev)},{passive:false});
mapPanel.addEventListener("mousedown",e=>{if(e.button!==0)return;dragging=true;mapPanel.classList.add("dragging");dragStartX=e.clientX;dragStartY=e.clientY;scrollStartLeft=mapPanel.scrollLeft;scrollStartTop=mapPanel.scrollTop});
window.addEventListener("mousemove",e=>{if(!dragging)return;mapPanel.scrollLeft=scrollStartLeft-(e.clientX-dragStartX);mapPanel.scrollTop=scrollStartTop-(e.clientY-dragStartY)});
window.addEventListener("mouseup",()=>{dragging=false;mapPanel.classList.remove("dragging")});
function setupMultiFilter(dropdown,button,menu,title,values){menu.innerHTML="";const actions=document.createElement("div");actions.className="filter-menu-actions";const sel=document.createElement("button"), desel=document.createElement("button");sel.type=desel.type="button";sel.textContent="Select All";desel.textContent="Deselect All";actions.append(sel,desel);menu.appendChild(actions);values.forEach(value=>{const label=document.createElement("label");label.className="filter-option";const cb=document.createElement("input");cb.type="checkbox";cb.value=value;cb.checked=true;cb.addEventListener("change",()=>{updateFilterButtonLabel(button,title,menu);renderPOIList();updateMarkerVisibility()});label.append(cb,document.createTextNode(value));menu.appendChild(label)});const close=document.createElement("button");close.type="button";close.className="filter-close";close.textContent="Close";close.addEventListener("click",()=>dropdown.classList.remove("open"));menu.appendChild(close);sel.addEventListener("click",e=>{e.stopPropagation();menu.querySelectorAll("input").forEach(cb=>cb.checked=true);updateFilterButtonLabel(button,title,menu);renderPOIList();updateMarkerVisibility()});desel.addEventListener("click",e=>{e.stopPropagation();menu.querySelectorAll("input").forEach(cb=>cb.checked=false);updateFilterButtonLabel(button,title,menu);renderPOIList();updateMarkerVisibility()});button.addEventListener("click",e=>{e.stopPropagation();document.querySelectorAll(".filter-dropdown.open").forEach(d=>{if(d!==dropdown)d.classList.remove("open")});dropdown.classList.toggle("open")});menu.addEventListener("click",e=>e.stopPropagation());updateFilterButtonLabel(button,title,menu)}
function updateFilterButtonLabel(button,title,menu){const boxes=[...menu.querySelectorAll("input")], checked=boxes.filter(cb=>cb.checked);button.textContent=!boxes.length||!checked.length?`${title}: None`:checked.length===boxes.length?`${title}: All`:checked.length===1?`${title}: ${checked[0].value}`:`${title}: ${checked.length} selected`}
function checkedFilterValues(menu){return new Set([...menu.querySelectorAll("input:checked")].map(cb=>cb.value))}
function populateFilters(){setupMultiFilter(categoryFilterDropdown,categoryFilterButton,categoryFilterMenu,"Categories",[...DATA.categories.map(c=>c.name),PC_QUEST_CATEGORY]);setupMultiFilter(factionFilterDropdown,factionFilterButton,factionFilterMenu,"Factions",DATA.factions.map(f=>f.name))}
document.addEventListener("click",()=>document.querySelectorAll(".filter-dropdown.open").forEach(d=>d.classList.remove("open")));
function renderLegend(){categoryLegend.innerHTML="";factionLegend.innerHTML="";DATA.categories.forEach(c=>{const item=document.createElement("div");item.className="legend-item";item.innerHTML=(c.icon?`<img class="legend-icon" src="${escapeAttr(c.icon)}">`:"◆")+`<span>${escapeHtml(c.name)}</span>`;categoryLegend.appendChild(item)});DATA.factions.forEach(f=>{const item=document.createElement("div");item.className="legend-item";item.innerHTML=`<span class="color-dot" style="color:${escapeAttr(f.color)}">●</span><span>${escapeHtml(f.name)}</span>`;factionLegend.appendChild(item)})}
function renderTerritories(){activeMap.territories.forEach(t=>{const poly=document.createElementNS("http://www.w3.org/2000/svg","polygon");poly.setAttribute("points",t.points.map(p=>`${p[0]},${p[1]}`).join(" "));poly.setAttribute("fill",t.fill);poly.setAttribute("stroke",t.color);poly.setAttribute("stroke-width","2");territorySvg.appendChild(poly);const label=document.createElement("div");label.className="territory-label";label.style.left=pctX(t.centroid[0]);label.style.top=pctY(t.centroid[1]);label.innerHTML=`${escapeHtml(t.title)}<br><span style="font-weight:500">${escapeHtml(t.faction)}</span>`;mapWrap.appendChild(label)})}
function renderPartyLocation(){if(!activeMap.party_location||activeMap.party_location.visible===false)return;const marker=document.createElement("div");marker.className="party-location";marker.title="Party Location";marker.style.left=pctX(activeMap.party_location.x);marker.style.top=pctY(activeMap.party_location.y);mapWrap.appendChild(marker)}
function renderPOIs(){activeMap.pois.forEach(p=>{const marker=document.createElement("button");marker.className="poi";marker.dataset.poiId=p.id;marker.style.left=pctX(p.x);marker.style.top=pctY(p.y);marker.style.background=p.color;marker.title=`${p.title}
${p.category} | ${p.faction}`;const inner=document.createElement("span");inner.className="poi-inner";if(p.icon){const img=document.createElement("img");img.src=p.icon;img.alt=p.category;inner.appendChild(img)}else inner.textContent="◆";marker.appendChild(inner);if(Array.isArray(p.linked_maps)&&p.linked_maps.length){const badge=document.createElement("span");badge.className="linked-map-badge";badge.textContent="↗";badge.title=p.linked_maps.length===1?`Linked map: ${p.linked_maps[0].name}`:`${p.linked_maps.length} linked maps`;marker.appendChild(badge)}marker.addEventListener("click",()=>selectPOI(p,true));markerById.set(p.id,marker);mapWrap.appendChild(marker)})}
function renderPCQuests(){activeMap.pc_quests.forEach(q=>{const marker=document.createElement("button");marker.className="pc-quest";marker.dataset.pcQuestId=q.id;marker.style.left=pctX(q.x);marker.style.top=pctY(q.y);marker.title=`${q.title}\nPC Quest | ${q.pc}`;const pin=document.createElement("span");pin.className="pc-quest-pin";const shape=document.createElement("span");shape.className="pc-quest-shape";shape.style.background=q.color;const icon=document.createElement("span");icon.className="pc-quest-icon";if(q.icon){const img=document.createElement("img");img.src=q.icon;img.alt=q.pc;icon.appendChild(img)}else icon.textContent="PC";pin.append(shape,icon);marker.appendChild(pin);marker.addEventListener("click",()=>selectPCQuest(q,true));pcQuestMarkerById.set(q.id,marker);mapWrap.appendChild(marker)})}
function filteredPOIs(){const s=poiSearch.value.trim().toLowerCase(), cats=checkedFilterValues(categoryFilterMenu), facs=checkedFilterValues(factionFilterMenu);return activeMap.pois.filter(p=>{const h=`${p.title} ${stripHtml(p.description||"")} ${p.category} ${p.faction}`.toLowerCase();return (!s||h.includes(s))&&cats.has(p.category)&&facs.has(p.faction)})}
function filteredPCQuests(){const s=poiSearch.value.trim().toLowerCase(), cats=checkedFilterValues(categoryFilterMenu);if(!cats.has(PC_QUEST_CATEGORY))return[];return activeMap.pc_quests.filter(q=>{const h=`${q.title} ${stripHtml(q.description||"")} ${q.pc} PC Quest`.toLowerCase();return !s||h.includes(s)})}
function updateMarkerVisibility(){const vp=new Set(filteredPOIs().map(p=>p.id));markerById.forEach((m,id)=>m.style.display=vp.has(id)?"":"none");const vq=new Set(filteredPCQuests().map(q=>q.id));pcQuestMarkerById.forEach((m,id)=>m.style.display=vq.has(id)?"":"none")}
function renderPOIList(){const pois=filteredPOIs(), quests=filteredPCQuests();poiList.innerHTML="";pois.forEach(p=>{const faction=factionByName.get(p.faction);const icon=p.icon?`<img class="poi-list-main-img" src="${escapeAttr(p.icon)}">`:"◆";const dot=faction?`<span class="faction-chip-dot" style="color:${escapeAttr(faction.color)}">●</span>`:"";const item=document.createElement("div");item.className="poi-list-item"+(selectedItemKey===`poi:${p.id}`?" active":"");item.innerHTML=`<div class="poi-list-icon" style="background:${escapeAttr(p.color)}"><div class="poi-list-icon-inner">${icon}</div></div><div><span class="poi-list-title">${escapeHtml(p.title)}</span><div class="poi-list-meta"><span class="list-tag">${escapeHtml(p.category)}</span><span class="list-tag">${dot} ${escapeHtml(p.faction)}</span></div></div>`;item.addEventListener("click",()=>selectPOI(p,true));poiList.appendChild(item)});if(quests.length){if(pois.length){const spacer=document.createElement("div");spacer.className="poi-list-spacer";poiList.appendChild(spacer)}const header=document.createElement("div");header.className="poi-list-header";header.textContent="PC Quest Markers";poiList.appendChild(header);quests.forEach(q=>{const icon=q.icon?`<img class="poi-list-main-img" src="${escapeAttr(q.icon)}">`:"PC";const item=document.createElement("div");item.className="poi-list-item"+(selectedItemKey===`quest:${q.id}`?" active":"");item.innerHTML=`<div class="poi-list-icon" style="background:${escapeAttr(q.color)}"><div class="poi-list-icon-inner">${icon}</div></div><div><span class="poi-list-title">${escapeHtml(q.pc)} - ${escapeHtml(q.title)}</span><div class="poi-list-meta"><span class="list-tag"><span class="faction-chip-dot" style="color:${escapeAttr(q.color)}">●</span> PC Quest</span></div></div>`;item.addEventListener("click",()=>selectPCQuest(q,true));poiList.appendChild(item)})}poiCount.textContent=`${pois.length}/${activeMap.pois.length} POIs; ${quests.length}/${activeMap.pc_quests.length} PC quests`;updateMarkerVisibility()}
function selectPOI(p,center=false){selectedItemKey=`poi:${p.id}`;markerById.forEach(m=>m.classList.remove("selected"));pcQuestMarkerById.forEach(m=>m.classList.remove("selected"));const marker=markerById.get(p.id);if(marker)marker.classList.add("selected");showPOI(p);renderPOIList();if(center)centerOn(p.x,p.y)}
function selectPCQuest(q,center=false){selectedItemKey=`quest:${q.id}`;markerById.forEach(m=>m.classList.remove("selected"));pcQuestMarkerById.forEach(m=>m.classList.remove("selected"));const marker=pcQuestMarkerById.get(q.id);if(marker)marker.classList.add("selected");showPCQuest(q);renderPOIList();if(center)centerOn(q.x,q.y)}
function centerOn(x,y){const r=mapPanel.getBoundingClientRect(),padX=activeMap.panPadX||activeMap.mapWidth*.20,padY=activeMap.panPadY||activeMap.mapHeight*.20;mapPanel.scrollLeft=(x+padX)*zoom-r.width/2;mapPanel.scrollTop=(y+padY)*zoom-r.height/2}
function showMapInfo(){detailsPane.innerHTML=`<div class="player-title">${escapeHtml(DATA.title||"Campaign Atlas")}</div><h1>${escapeHtml(activeMap.name)}</h1><p>${activeMap.pois.length} POIs, ${activeMap.pc_quests.length} PC Quest markers, ${activeMap.territories.length} territories.</p>`}
function showPOI(p){const faction=factionByName.get(p.faction);const icon=p.icon?`<img src="${escapeAttr(p.icon)}" alt="${escapeAttr(p.title)}">`:"◆";const categoryIcon=p.category_icon?`<img src="${escapeAttr(p.category_icon)}" alt="${escapeAttr(p.category)}">`:"◆";const dot=faction?`<span class="faction-chip-dot" style="color:${escapeAttr(faction.color)}">●</span>`:"";const linked=(Array.isArray(p.linked_maps)&&p.linked_maps.length)?p.linked_maps.map(linkedMap=>`<button onclick="openLinkedMap(${Number(linkedMap.id)})">Open ${escapeHtml(linkedMap.name||"Map")}</button>`).join(" "):"";detailsPane.innerHTML=`<div class="player-title">${escapeHtml(DATA.title||"Campaign Atlas")}</div><div class="poi-header"><div class="poi-header-icon">${icon}</div><div><h1>${escapeHtml(p.title)}</h1></div></div><div class="badge-row"><span class="badge">${categoryIcon} <strong>Category:</strong> ${escapeHtml(p.category)}</span><span class="badge">${dot} <strong>Faction:</strong> ${escapeHtml(p.faction)}</span>${linked}</div><div id="description">${p.description||"<em>No description.</em>"}</div>`}
function openLinkedMap(mapId){if(DATA.maps.some(m=>m.id===mapId))loadMap(mapId)}
function showPCQuest(q){const icon=q.icon?`<img src="${escapeAttr(q.icon)}" alt="${escapeAttr(q.pc)}">`:"PC";detailsPane.innerHTML=`<div class="player-title">${escapeHtml(DATA.title||"Campaign Atlas")}</div><div class="poi-header"><div class="poi-header-icon">${icon}</div><div><h1>${escapeHtml(q.title)}</h1></div></div><div class="badge-row"><span class="badge"><span class="faction-chip-dot" style="color:${escapeAttr(q.color)}">●</span> <strong>PC:</strong> ${escapeHtml(q.pc)}</span><span class="badge"><strong>Layer:</strong> PC Quest</span></div><div id="description">${q.description||"<em>No description.</em>"}</div>`}
function stripHtml(v){const d=document.createElement("div");d.innerHTML=v||"";return d.textContent||d.innerText||""}
function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function escapeAttr(v){return escapeHtml(v).replaceAll("`","&#096;")}
poiSearch.addEventListener("input",()=>{renderPOIList();updateMarkerVisibility()});
upLayerButton.addEventListener("click",goUpOneLayer);
renderLegend();setupMapSelector();populateFilters();loadMap(activeMapId);
</script>
</body>
</html>
