<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zuul</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
    --bg-dark: #1c1712;
    --parchment: #efe2c4;
    --parchment-2: #e3d2ae;
    --ink: #2c2419;
    --ink-soft: #5b4b35;
    --accent: #6c3f1f;
    --accent-2: #8c6239;
    --panel-shadow: 0 10px 24px rgba(0,0,0,0.35);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background:
        radial-gradient(circle at top left, rgba(255,255,255,0.05), transparent 28%),
        linear-gradient(180deg, #241b13 0%, #1a1410 100%);
    color: var(--ink);
}

#app {
    display: flex;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
}

#mapPanel {
    flex: 1;
    overflow: auto;
    background:
        linear-gradient(180deg, rgba(0,0,0,0.10), rgba(0,0,0,0.20)),
        #2a2118;
    padding: 20px;
    cursor: grab;
}
#mapPanel.dragging {
    cursor: grabbing;
    user-select: none;
}

#zoomStage {
    position: relative;
    width: 4000px;
    height: 5000px;
    margin: 0 auto;
}
#mapWrap {
    position: absolute;
    left: 0;
    top: 0;
    width: 4000px;
    height: 5000px;
    transform-origin: top left;
    box-shadow: 0 18px 36px rgba(0,0,0,0.45);
    border: 2px solid rgba(255,255,255,0.10);
}
#mapImg {
    position: absolute;
    left: 0;
    top: 0;
    width: 4000px;
    height: 5000px;
    display: block;
    user-select: none;
    pointer-events: none;
}
#territorySvg {
    position: absolute;
    left: 0;
    top: 0;
    width: 4000px;
    height: 5000px;
    pointer-events: none;
}
.territory-label {
    position: absolute;
    transform: translate(-50%, -50%);
    background: rgba(239, 226, 196, 0.88);
    border: 1px solid rgba(70, 54, 35, 0.55);
    border-radius: 10px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 3px 8px rgba(0,0,0,0.20);
}

.poi {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid #221810;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.55);
    z-index: 10;
    transition: transform 0.08s ease, box-shadow 0.12s ease;
}
.poi:hover, .poi.selected {
    outline: 3px solid rgba(255,255,255,0.92);
    z-index: 20;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.14), 0 6px 14px rgba(0,0,0,0.65);
}
.poi:hover {
    transform: translate(-50%, -50%) scale(1.04);
}
.poi-inner {
    width: 26px;
    height: 26px;
    background: #f5efe2;
    border: 1px solid #2d2218;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.poi-inner img {
    max-width: 21px;
    max-height: 21px;
}

#infoPanel {
    width: 400px;
    max-width: 42vw;
    min-width: 320px;
    background:
        linear-gradient(180deg, rgba(255,255,255,0.18), rgba(0,0,0,0.03)),
        linear-gradient(180deg, var(--parchment) 0%, var(--parchment-2) 100%);
    border-left: 1px solid rgba(65, 48, 29, 0.55);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: -6px 0 18px rgba(0,0,0,0.18);
    transition: width 0.22s ease, min-width 0.22s ease, max-width 0.22s ease, opacity 0.18s ease;
}
#infoPanel.collapsed {
    width: 0 !important;
    min-width: 0 !important;
    max-width: 0 !important;
    border-left: none;
    opacity: 0;
}

#detailsPane {
    flex: 1 1 auto;
    min-height: 0;
    padding: 16px 18px 16px 18px;
    overflow-y: auto;
}
#detailsPane h1 {
    font-size: 24px;
    margin: 0 0 10px 0;
    color: #2f2317;
}
#detailsPane .placeholder {
    color: #6a5a43;
    font-style: italic;
}
#description {
    line-height: 1.45;
    font-size: 14px;
}
#description ul { padding-left: 20px; }
#description p:first-child { margin-top: 0; }

.player-title {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 7px;
}
.poi-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
}
.poi-header-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(44, 33, 20, 0.85);
    background: rgba(255,255,255,0.55);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex: 0 0 auto;
}
.poi-header-icon img {
    width: 22px;
    height: 22px;
    object-fit: contain;
}
.badge-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0 14px 0;
}
.badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(60, 44, 26, 0.35);
    background: rgba(255,255,255,0.34);
    font-size: 12px;
    color: #3f3122;
}
.badge img {
    width: 16px;
    height: 16px;
    object-fit: contain;
}
.faction-chip-dot {
    font-size: 14px;
    line-height: 1;
}

#poiBrowser {
    flex: 0 0 34%;
    max-height: 38%;
    min-height: 245px;
    border-bottom: 1px solid rgba(83, 63, 40, 0.35);
    background: rgba(94, 66, 36, 0.07);
    padding: 12px 12px 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 7px;
}
.browser-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.browser-title {
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
}
#poiCount {
    font-size: 11px;
    color: #6a573f;
}
#poiSearch {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 9px;
    border: 1px solid #ab9576;
    border-radius: 8px;
    font-size: 12px;
    background: rgba(255,250,241,0.92);
    color: var(--ink);
    font-family: inherit;
}
.filter-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    position: relative;
}
.filter-dropdown {
    position: relative;
}
.filter-button {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid #ab9576;
    border-radius: 8px;
    font-size: 12px;
    background: rgba(255,250,241,0.92);
    color: var(--ink);
    font-family: inherit;
    text-align: left;
    cursor: pointer;
}
.filter-button::after {
    content: "▾";
    float: right;
    opacity: 0.75;
}
.filter-menu {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 210px;
    max-height: 300px;
    overflow-y: auto;
    z-index: 300;
    background: rgba(255,250,241,0.98);
    border: 1px solid #ab9576;
    border-radius: 10px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.28);
    padding: 7px;
}
.filter-dropdown.open .filter-menu {
    display: block;
}
.filter-dropdown:last-child .filter-menu {
    right: 0;
    left: auto;
}
.filter-menu-actions {
    display: flex;
    gap: 5px;
    margin-bottom: 6px;
}
.filter-menu-actions button, .filter-close {
    flex: 1;
    border: 1px solid rgba(109, 85, 58, 0.35);
    border-radius: 7px;
    background: rgba(239,226,196,0.85);
    color: #3f3122;
    font-family: inherit;
    font-size: 11px;
    padding: 4px 5px;
    cursor: pointer;
}
.filter-option {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 3px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
}
.filter-option input {
    margin: 0;
}
.filter-close {
    width: 100%;
    margin-top: 6px;
}
.party-location {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 4px solid #00c853;
    box-shadow: 0 0 0 2px rgba(15,45,25,0.75), 0 0 12px rgba(0,200,83,0.65);
    background: transparent;
    z-index: 2;
    pointer-events: none;
}

.pc-quest {
    position: absolute;
    transform: translate(-50%, -100%);
    width: 40px;
    height: 52px;
    z-index: 12;
    cursor: pointer;
    border: 0;
    background: transparent;
    padding: 0;
}
.pc-quest-pin {
    position: relative;
    display: block;
    width: 40px;
    height: 52px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.55));
}
.pc-quest-shape {
    position: absolute;
    left: 50%;
    top: 2px;
    width: 34px;
    height: 42px;
    transform: translateX(-50%);
    clip-path: polygon(
        50% 100%,
        16% 58%,
        8% 36%,
        13% 19%,
        27% 7%,
        50% 2%,
        73% 7%,
        87% 19%,
        92% 36%,
        84% 58%
    );
    border: 0;
    background: #6f4cc3;
}
.pc-quest-shape::after {
    content: "";
    position: absolute;
    inset: 2px;
    clip-path: inherit;
    border: 2px solid #221810;
    pointer-events: none;
}
.pc-quest-icon {
    position: absolute;
    left: 50%;
    top: 8px;
    transform: translateX(-50%);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #f5efe2;
    border: 1px solid #2d2218;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: #2d2218;
    font-size: 10px;
    font-weight: bold;
}
.pc-quest-icon img {
    max-width: 18px;
    max-height: 18px;
    object-fit: contain;
}
.pc-quest:hover, .pc-quest.selected {
    outline: 3px solid rgba(255,255,255,0.92);
    outline-offset: 2px;
}
.poi-list-spacer {
    height: 8px;
}
.poi-list-header {
    padding: 6px 8px 5px 8px;
    margin: 3px 0 5px 0;
    border-top: 1px solid rgba(109, 85, 58, 0.32);
    color: var(--accent);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 12px;
}
#poiList {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    border: 1px solid rgba(140, 117, 82, 0.55);
    border-radius: 10px;
    background: rgba(255,251,244,0.42);
    padding: 6px;
}
.poi-list-item {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 7px;
    align-items: center;
    padding: 6px 7px;
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    background: rgba(255,255,255,0.38);
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
}
.poi-list-item:last-child { margin-bottom: 0; }
.poi-list-item:hover {
    background: rgba(255,255,255,0.82);
    border-color: rgba(111, 77, 43, 0.30);
    transform: translateY(-1px);
}
.poi-list-item.active {
    background: rgba(224, 212, 186, 0.95);
    border-color: rgba(111, 77, 43, 0.58);
}
.poi-list-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #2a1c12;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.20);
    flex: 0 0 28px;
}
.poi-list-icon-inner {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #2a1c12;
    overflow: hidden;
}
.poi-list-icon-inner img {
    width: 15px !important;
    height: 15px !important;
    max-width: 15px !important;
    max-height: 15px !important;
    object-fit: contain;
    display: block;
}
.poi-list-text { min-width: 0; }
.poi-list-title {
    display: block;
    font-weight: 700;
    color: #33271b;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.poi-list-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    color: #5d4d38;
    font-size: 11px;
}
.list-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border-radius: 999px;
    padding: 2px 6px;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(109, 85, 58, 0.22);
    line-height: 1.15;
}
.list-tag img {
    width: 12px !important;
    height: 12px !important;
    max-width: 12px !important;
    max-height: 12px !important;
    object-fit: contain;
    display: inline-block;
    vertical-align: middle;
}

#controls {
    position: fixed;
    left: 16px;
    top: 16px;
    background: rgba(239,226,196,0.94);
    border: 1px solid rgba(60,44,26,0.45);
    border-radius: 12px;
    padding: 9px 10px;
    display: flex;
    gap: 6px;
    align-items: center;
    z-index: 100;
    box-shadow: var(--panel-shadow);
}
#controls button, #toggleSidebarButton, #toggleLegendButton {
    border: 1px solid rgba(60,44,26,0.45);
    background: linear-gradient(180deg, #fff7ea 0%, #ead9b7 100%);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-weight: bold;
    color: #3a2a1c;
    font-family: inherit;
}
#controls button:hover, #toggleSidebarButton:hover, #toggleLegendButton:hover {
    background: linear-gradient(180deg, #fffaf2 0%, #efdfbf 100%);
}
#zoomLabel {
    min-width: 48px;
    text-align: center;
    font-size: 12px;
    color: #4e3d2b;
}
#bottomControls {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 110;
    display: flex;
    gap: 8px;
    align-items: center;
}
#toggleSidebarButton, #toggleLegendButton {
    box-shadow: var(--panel-shadow);
}

.legend {
    position: fixed;
    left: 16px;
    bottom: 16px;
    background: rgba(239,226,196,0.94);
    border: 1px solid rgba(60,44,26,0.42);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 12px;
    max-width: 490px;
    z-index: 100;
    box-shadow: var(--panel-shadow);
}
.legend.hidden {
    display: none;
}
.legend-title {
    font-weight: bold;
    margin: 0 0 4px 0;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 12px;
}
.legend-grid {
    display: grid;
    grid-template-columns: repeat(3, max-content);
    column-gap: 14px;
    row-gap: 5px;
    margin-bottom: 8px;
}
.legend-factions {
    display: grid;
    grid-template-columns: repeat(4, max-content);
    column-gap: 14px;
    row-gap: 5px;
}
.legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    color: #453524;
}
.legend-item img {
    width: 18px;
    height: 18px;
    object-fit: contain;
}
.color-dot {
    font-size: 16px;
    line-height: 1;
}

@media (max-width: 1100px) {
    #infoPanel {
        width: 340px;
        max-width: 48vw;
    }
    .legend {
        max-width: 360px;
    }
}
</style>
</head>
<body>
<div id="app">
    <div id="mapPanel">
        <div id="zoomStage">
            <div id="mapWrap">
                <img id="mapImg" alt="Campaign map">
                <svg id="territorySvg" viewBox="0 0 4000 5000" preserveAspectRatio="none"></svg>
            </div>
        </div>
    </div>

    <aside id="infoPanel">
        <div id="poiBrowser">
            <div class="browser-topbar">
                <div class="browser-title">POIs</div>
                <div id="poiCount"></div>
            </div>
            <input id="poiSearch" type="search" placeholder="Search POIs...">
            <div class="filter-row">
                <div class="filter-dropdown" id="categoryFilterDropdown">
                    <button type="button" class="filter-button" id="categoryFilterButton">Categories: All</button>
                    <div class="filter-menu" id="categoryFilterMenu"></div>
                </div>
                <div class="filter-dropdown" id="factionFilterDropdown">
                    <button type="button" class="filter-button" id="factionFilterButton">Factions: All</button>
                    <div class="filter-menu" id="factionFilterMenu"></div>
                </div>
            </div>
            <div id="poiList"></div>
        </div>

        <div id="detailsPane">
            <div class="player-title">Zuul</div>
            <h1>Map Information</h1>
            <p class="placeholder">Click a marker or choose a POI from the list.</p>
        </div>
    </aside>
</div>

<div id="controls">
    <button type="button" onclick="zoomOut()">−</button>
    <span id="zoomLabel">100%</span>
    <button type="button" onclick="zoomIn()">+</button>
    <button type="button" onclick="resetZoom()">Reset</button>
</div>

<div id="bottomControls">
    <button id="toggleSidebarButton" type="button" onclick="toggleSidebar()">Hide Sidebar</button>
    <button id="toggleLegendButton" type="button" onclick="toggleLegend()">Hide Legend</button>
</div>

<div class="legend" id="mapLegend">
    <div class="legend-title">Categories</div>
    <div id="categoryLegend" class="legend-grid"></div>
    <div class="legend-title">Faction Colors</div>
    <div id="factionLegend" class="legend-factions"></div>
</div>

const poiCount = document.getElementById("poiCount");

const PC_QUEST_CATEGORY = "PC Quests";

let zoom = 1.0;
let dragging = false;
let dragStartX = 0;
let dragStartY = 0;
let scrollStartLeft = 0;
let scrollStartTop = 0;
let selectedPoiId = null;
let sidebarCollapsed = false;
let legendCollapsed = false;
const markerById = new Map();
const pcQuestMarkerById = new Map();
const categoryByName = new Map(DATA.categories.map(c => [c.name, c]));
const factionByName = new Map(DATA.factions.map(f => [f.name, f]));

mapImg.src = DATA.mapImage;
territorySvg.setAttribute("viewBox", `0 0 ${DATA.mapWidth} ${DATA.mapHeight}`);

function pctX(x) {
    return (x / DATA.mapWidth * 100).toFixed(5) + "%";
}
function pctY(y) {
    return (y / DATA.mapHeight * 100).toFixed(5) + "%";
}

function applyZoom(anchorClientX = null, anchorClientY = null, previousZoom = zoom) {
    let anchorMapX = null;
    let anchorMapY = null;

    if (anchorClientX !== null && anchorClientY !== null) {
        const panelRect = mapPanel.getBoundingClientRect();
        anchorMapX = (mapPanel.scrollLeft + anchorClientX - panelRect.left) / previousZoom;
        anchorMapY = (mapPanel.scrollTop + anchorClientY - panelRect.top) / previousZoom;
    }

    mapWrap.style.transform = `scale(${zoom})`;
    zoomStage.style.width = `${DATA.mapWidth * zoom}px`;
    zoomStage.style.height = `${DATA.mapHeight * zoom}px`;
    zoomLabel.textContent = `${Math.round(zoom * 100)}%`;

    if (anchorMapX !== null && anchorMapY !== null) {
        const panelRect = mapPanel.getBoundingClientRect();
        mapPanel.scrollLeft = anchorMapX * zoom - (anchorClientX - panelRect.left);
        mapPanel.scrollTop = anchorMapY * zoom - (anchorClientY - panelRect.top);
    }
}

function setZoom(newZoom, anchorClientX = null, anchorClientY = null) {
    const previousZoom = zoom;
    zoom = Math.max(0.35, Math.min(4.0, newZoom));
    applyZoom(anchorClientX, anchorClientY, previousZoom);
}
function zoomIn() { setZoom(zoom + 0.20, window.innerWidth / 2, window.innerHeight / 2); }
function zoomOut() { setZoom(zoom - 0.20, window.innerWidth / 2, window.innerHeight / 2); }
function resetZoom() { setZoom(1.0, window.innerWidth / 2, window.innerHeight / 2); }

function toggleSidebar() {
    sidebarCollapsed = !sidebarCollapsed;
    infoPanel.classList.toggle("collapsed", sidebarCollapsed);
    toggleSidebarButton.textContent = sidebarCollapsed ? "Show Sidebar" : "Hide Sidebar";
}

function toggleLegend() {
    legendCollapsed = !legendCollapsed;
    mapLegend.classList.toggle("hidden", legendCollapsed);
    toggleLegendButton.textContent = legendCollapsed ? "Show Legend" : "Hide Legend";
}

mapPanel.addEventListener("wheel", function(event) {
    if (!event.ctrlKey) return;
    event.preventDefault();
    if (event.deltaY < 0) setZoom(zoom + 0.15, event.clientX, event.clientY);
    else setZoom(zoom - 0.15, event.clientX, event.clientY);
}, { passive: false });

mapPanel.addEventListener("mousedown", function(event) {
    if (event.button !== 0) return;
    if (event.target.closest(".poi")) return;

    dragging = true;
    dragStartX = event.clientX;
    dragStartY = event.clientY;
    scrollStartLeft = mapPanel.scrollLeft;
    scrollStartTop = mapPanel.scrollTop;
    mapPanel.classList.add("dragging");
    event.preventDefault();
});

window.addEventListener("mousemove", function(event) {
    if (!dragging) return;
    const dx = event.clientX - dragStartX;
    const dy = event.clientY - dragStartY;
    mapPanel.scrollLeft = scrollStartLeft - dx;
    mapPanel.scrollTop = scrollStartTop - dy;
});

window.addEventListener("mouseup", function() {
    dragging = false;
    mapPanel.classList.remove("dragging");
});

function renderLegend() {
    DATA.categories.forEach(c => {
        const item = document.createElement("div");
        item.className = "legend-item";

        if (c.icon) {
            const img = document.createElement("img");
            img.src = c.icon;
            img.alt = c.name;
            item.appendChild(img);
        } else {
            const fallback = document.createElement("span");
            fallback.textContent = "◆";
            item.appendChild(fallback);
        }

        const text = document.createElement("span");
        text.textContent = c.name;
        item.appendChild(text);
        categoryLegend.appendChild(item);
    });

    DATA.factions.forEach(f => {
        const item = document.createElement("div");
        item.className = "legend-item";

        const dot = document.createElement("span");
        dot.className = "color-dot";
        dot.textContent = "●";
        dot.style.color = f.color;
        item.appendChild(dot);

        const text = document.createElement("span");
        text.textContent = f.name;
        item.appendChild(text);

        factionLegend.appendChild(item);
    });

    const pcQuestColors = new Map();
    (DATA.pc_quests || []).forEach(q => {
        if (!pcQuestColors.has(q.pc)) pcQuestColors.set(q.pc, q.color);
    });

    if (pcQuestColors.size) {
        const title = document.createElement("div");
        title.className = "legend-title";
        title.textContent = "PC Quest Colors";
        factionLegend.parentElement.appendChild(title);

        const pcGrid = document.createElement("div");
        pcGrid.className = "legend-factions";
        pcQuestColors.forEach((color, pc) => {
            const item = document.createElement("div");
            item.className = "legend-item";

            const dot = document.createElement("span");
            dot.className = "color-dot";
            dot.textContent = "●";
            dot.style.color = color;
            item.appendChild(dot);

            const text = document.createElement("span");
            text.textContent = pc;
            item.appendChild(text);

            pcGrid.appendChild(item);
        });
        factionLegend.parentElement.appendChild(pcGrid);
    }
}

function setupMultiFilter(dropdown, button, menu, title, values) {
    menu.innerHTML = "";

    const actions = document.createElement("div");
    actions.className = "filter-menu-actions";

    const selectAll = document.createElement("button");
    selectAll.type = "button";
    selectAll.textContent = "Select All";

    const deselectAll = document.createElement("button");
    deselectAll.type = "button";
    deselectAll.textContent = "Deselect All";

    actions.appendChild(selectAll);
    actions.appendChild(deselectAll);
    menu.appendChild(actions);

    values.forEach(value => {
        const label = document.createElement("label");
        label.className = "filter-option";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = value;
        checkbox.checked = true;

        const text = document.createElement("span");
        text.textContent = value;

        checkbox.addEventListener("change", () => {
            updateFilterButtonLabel(button, title, menu);
            renderPOIList();
            updateMarkerVisibility();
        });

        label.appendChild(checkbox);
        label.appendChild(text);
        menu.appendChild(label);
    });

    const closeButton = document.createElement("button");
    closeButton.type = "button";
    closeButton.className = "filter-close";
    closeButton.textContent = "Close";
    closeButton.addEventListener("click", () => dropdown.classList.remove("open"));
    menu.appendChild(closeButton);

    selectAll.addEventListener("click", event => {
        event.stopPropagation();
        menu.querySelectorAll("input[type='checkbox']").forEach(cb => cb.checked = true);
        updateFilterButtonLabel(button, title, menu);
        renderPOIList();
        updateMarkerVisibility();
    });

    deselectAll.addEventListener("click", event => {
        event.stopPropagation();
        menu.querySelectorAll("input[type='checkbox']").forEach(cb => cb.checked = false);
        updateFilterButtonLabel(button, title, menu);
        renderPOIList();
        updateMarkerVisibility();
    });

    button.addEventListener("click", event => {
        event.stopPropagation();
        document.querySelectorAll(".filter-dropdown.open").forEach(openDropdown => {
            if (openDropdown !== dropdown) openDropdown.classList.remove("open");
        });
        dropdown.classList.toggle("open");
    });

    menu.addEventListener("click", event => event.stopPropagation());
    updateFilterButtonLabel(button, title, menu);
}

function updateFilterButtonLabel(button, title, menu) {
    const checkboxes = [...menu.querySelectorAll("input[type='checkbox']")];
    const checked = checkboxes.filter(cb => cb.checked);

    if (checkboxes.length === 0 || checked.length === 0) {
        button.textContent = `${title}: None`;
    } else if (checked.length === checkboxes.length) {
        button.textContent = `${title}: All`;
    } else if (checked.length === 1) {
        button.textContent = `${title}: ${checked[0].value}`;
    } else {
        button.textContent = `${title}: ${checked.length} selected`;
    }
}

function checkedFilterValues(menu) {
    return new Set([...menu.querySelectorAll("input[type='checkbox']:checked")].map(cb => cb.value));
}

function populateFilters() {
    const categoryNames = [...DATA.categories.map(c => c.name), PC_QUEST_CATEGORY];
    const factionNames = [...DATA.factions.map(f => f.name)];

    setupMultiFilter(categoryFilterDropdown, categoryFilterButton, categoryFilterMenu, "Categories", categoryNames);
    setupMultiFilter(factionFilterDropdown, factionFilterButton, factionFilterMenu, "Factions", factionNames);
}

document.addEventListener("click", () => {
    document.querySelectorAll(".filter-dropdown.open").forEach(dropdown => dropdown.classList.remove("open"));
});


function renderTerritories() {
    DATA.territories.forEach(t => {
        const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        polygon.setAttribute("points", t.points.map(p => `${p[0]},${p[1]}`).join(" "));
        polygon.setAttribute("fill", t.fill);
        polygon.setAttribute("stroke", t.color);
        polygon.setAttribute("stroke-width", "2");
        territorySvg.appendChild(polygon);

        const label = document.createElement("div");
        label.className = "territory-label";
        label.style.left = pctX(t.centroid[0]);
        label.style.top = pctY(t.centroid[1]);
        label.innerHTML = `${escapeHtml(t.title)}<br><span style="font-weight:500">${escapeHtml(t.faction)}</span>`;
        mapWrap.appendChild(label);
    });
}

function renderPartyLocation() {
    if (!DATA.party_location || DATA.party_location.visible === false) return;

    const marker = document.createElement("div");
    marker.className = "party-location";
    marker.title = "Party Location";
    marker.style.left = pctX(DATA.party_location.x);
    marker.style.top = pctY(DATA.party_location.y);
    mapWrap.appendChild(marker);
}

function renderPCQuests() {
    (DATA.pc_quests || []).forEach(q => {
        const marker = document.createElement("button");
        marker.className = "pc-quest";
        marker.dataset.pcQuestId = q.id;
        marker.style.left = pctX(q.x);
        marker.style.top = pctY(q.y);
        marker.title = `${q.title}
PC Quest | ${q.pc}`;

        const pin = document.createElement("span");
        pin.className = "pc-quest-pin";

        const shape = document.createElement("span");
        shape.className = "pc-quest-shape";
        shape.style.background = q.color;

        const icon = document.createElement("span");
        icon.className = "pc-quest-icon";
        if (q.icon) {
            const img = document.createElement("img");
            img.src = q.icon;
            img.alt = q.pc;
            icon.appendChild(img);
        } else {
            icon.textContent = "PC";
        }

        pin.appendChild(shape);
        pin.appendChild(icon);
        marker.appendChild(pin);
        marker.addEventListener("click", () => selectPCQuest(q, true));
        pcQuestMarkerById.set(q.id, marker);
        mapWrap.appendChild(marker);
    });
}

function renderPOIs() {
    DATA.pois.forEach(p => {
        const marker = document.createElement("button");
        marker.className = "poi";
        marker.dataset.poiId = p.id;
        marker.style.left = pctX(p.x);
        marker.style.top = pctY(p.y);
        marker.style.background = p.color;
        marker.title = `${p.title}
${p.category} | ${p.faction}`;

        const inner = document.createElement("span");
        inner.className = "poi-inner";

        if (p.icon) {
            const img = document.createElement("img");
            img.src = p.icon;
            img.alt = p.category;
            inner.appendChild(img);
        } else {
            inner.textContent = "◆";
        }

        marker.appendChild(inner);
        marker.addEventListener("click", () => selectPOI(p, true));
        markerById.set(p.id, marker);
        mapWrap.appendChild(marker);
    });
}

function filteredPOIs() {
    const searchText = poiSearch.value.trim().toLowerCase();
    const checkedCategories = checkedFilterValues(categoryFilterMenu);
    const checkedFactions = checkedFilterValues(factionFilterMenu);

    return DATA.pois.filter(p => {
        const plainDescription = stripHtml(p.description || "");
        const haystack = `${p.title} ${plainDescription} ${p.category} ${p.faction}`.toLowerCase();
        if (searchText && !haystack.includes(searchText)) return false;
        if (!checkedCategories.has(p.category)) return false;
        if (!checkedFactions.has(p.faction)) return false;
        return true;
    });
}

function filteredPCQuests() {
    const searchText = poiSearch.value.trim().toLowerCase();
    const checkedCategories = checkedFilterValues(categoryFilterMenu);

    if (!checkedCategories.has(PC_QUEST_CATEGORY)) return [];

    return (DATA.pc_quests || []).filter(q => {
        const plainDescription = stripHtml(q.description || "");
        const haystack = `${q.title} ${plainDescription} ${q.pc} PC Quest`.toLowerCase();
        return !searchText || haystack.includes(searchText);
    });
}

function updateMarkerVisibility() {
    const visiblePoiIds = new Set(filteredPOIs().map(p => p.id));
    markerById.forEach((marker, id) => {
        marker.style.display = visiblePoiIds.has(id) ? "" : "none";
    });

    const visibleQuestIds = new Set(filteredPCQuests().map(q => q.id));
    pcQuestMarkerById.forEach((marker, id) => {
        marker.style.display = visibleQuestIds.has(id) ? "" : "none";
    });
}

function renderPOIList() {
    const pois = filteredPOIs();
    const pcQuests = filteredPCQuests();
    poiList.innerHTML = "";

    pois.forEach(p => {
        const item = document.createElement("div");
        item.className = "poi-list-item" + (p.id === selectedPoiId ? " active" : "");

        const category = categoryByName.get(p.category);
        const mainIconHtml = category && category.icon
            ? `<img class="poi-list-main-img" src="${escapeAttr(category.icon)}" alt="${escapeAttr(p.category)}">`
            : "◆";
        const tagIconHtml = category && category.icon
            ? `<img class="poi-list-tag-img" src="${escapeAttr(category.icon)}" alt="">`
            : "◆";

        const faction = factionByName.get(p.faction);
        const factionDot = faction
            ? `<span class="faction-chip-dot" style="color:${escapeAttr(faction.color)}">●</span>`
            : "";

        item.innerHTML = `
            <div class="poi-list-icon" style="background:${escapeAttr(p.color)};">
                <div class="poi-list-icon-inner">${mainIconHtml}</div>
            </div>
            <div class="poi-list-text">
                <span class="poi-list-title">${escapeHtml(p.title)}</span>
                <div class="poi-list-meta">
                    <span class="list-tag">${tagIconHtml} ${escapeHtml(p.category)}</span>
                    <span class="list-tag">${factionDot} ${escapeHtml(p.faction)}</span>
                </div>
            </div>
        `;
        item.addEventListener("click", () => selectPOI(p, true));
        poiList.appendChild(item);
    });

    if (pcQuests.length) {
        if (pois.length) {
            const spacer = document.createElement("div");
            spacer.className = "poi-list-spacer";
            poiList.appendChild(spacer);
        }

        const header = document.createElement("div");
        header.className = "poi-list-header";
        header.textContent = "PC Quest Markers";
        poiList.appendChild(header);

        pcQuests.forEach(q => {
            const item = document.createElement("div");
            item.className = "poi-list-item" + (q.id === selectedPoiId ? " active" : "");

            const iconHtml = q.icon
                ? `<img class="poi-list-main-img" src="${escapeAttr(q.icon)}" alt="${escapeAttr(q.pc)}">`
                : "PC";

            item.innerHTML = `
                <div class="poi-list-icon" style="background:${escapeAttr(q.color)};">
                    <div class="poi-list-icon-inner">${iconHtml}</div>
                </div>
                <div class="poi-list-text">
                    <span class="poi-list-title">${escapeHtml(q.pc)} - ${escapeHtml(q.title)}</span>
                    <div class="poi-list-meta">
                        <span class="list-tag"><span class="faction-chip-dot" style="color:${escapeAttr(q.color)}">●</span> PC Quest</span>
                    </div>
                </div>
            `;
            item.addEventListener("click", () => selectPCQuest(q, true));
            poiList.appendChild(item);
        });
    }

    const totalQuests = (DATA.pc_quests || []).length;
    poiCount.textContent = `${pois.length} / ${DATA.pois.length} POIs` + (totalQuests ? `; ${pcQuests.length} / ${totalQuests} PC quests` : "");
    updateMarkerVisibility();
}

function selectPOI(p, centerMap = false) {
    selectedPoiId = p.id;

    markerById.forEach(marker => marker.classList.remove("selected"));
    pcQuestMarkerById.forEach(marker => marker.classList.remove("selected"));

    const marker = markerById.get(p.id);
    if (marker) marker.classList.add("selected");

    showPOI(p);
    renderPOIList();

    if (centerMap) {
        const panelRect = mapPanel.getBoundingClientRect();
        mapPanel.scrollLeft = p.x * zoom - panelRect.width / 2;
        mapPanel.scrollTop = p.y * zoom - panelRect.height / 2;
    }
}

function selectPCQuest(q, centerMap = false) {
    selectedPoiId = q.id;

    markerById.forEach(marker => marker.classList.remove("selected"));
    pcQuestMarkerById.forEach(marker => marker.classList.remove("selected"));

    const marker = pcQuestMarkerById.get(q.id);
    if (marker) marker.classList.add("selected");

    showPCQuest(q);
    renderPOIList();

    if (centerMap) {
        const panelRect = mapPanel.getBoundingClientRect();
        mapPanel.scrollLeft = q.x * zoom - panelRect.width / 2;
        mapPanel.scrollTop = q.y * zoom - panelRect.height / 2;
    }
}

function showPCQuest(q) {
    const pcIcon = q.icon
        ? `<img src="${escapeAttr(q.icon)}" alt="${escapeAttr(q.pc)}">`
        : "PC";

    detailsPane.innerHTML = `
        <div class="player-title">${escapeHtml(DATA.title || "Campaign Map")}</div>
        <div class="poi-header">
            <div class="poi-header-icon">${pcIcon}</div>
            <div><h1>${escapeHtml(q.title)}</h1></div>
        </div>
        <div class="badge-row">
            <span class="badge"><span class="faction-chip-dot" style="color:${escapeAttr(q.color)}">●</span> <strong>PC:</strong> ${escapeHtml(q.pc)}</span>
            <span class="badge"><strong>Layer:</strong> PC Quest</span>
        </div>
        <div id="description">${q.description || "<em>No description.</em>"}</div>
    `;
}


function showPOI(p) {
    const category = categoryByName.get(p.category);
    const faction = factionByName.get(p.faction);

    const categoryIcon = category && category.icon
        ? `<img src="${escapeAttr(category.icon)}" alt="${escapeAttr(p.category)}">`
        : "◆";

    const factionDot = faction
        ? `<span class="faction-chip-dot" style="color:${escapeAttr(faction.color)}">●</span>`
        : "";

    detailsPane.innerHTML = `
        <div class="player-title">${escapeHtml(DATA.title || "Campaign Map")}</div>
        <div class="poi-header">
            <div class="poi-header-icon">${categoryIcon}</div>
            <div><h1>${escapeHtml(p.title)}</h1></div>
        </div>
        <div class="badge-row">
            <span class="badge">${categoryIcon} <strong>Category:</strong> ${escapeHtml(p.category)}</span>
            <span class="badge">${factionDot} <strong>Faction:</strong> ${escapeHtml(p.faction)}</span>
        </div>
        <div id="description">${p.description || "<em>No description.</em>"}</div>
    `;
}

function stripHtml(value) {
    const div = document.createElement("div");
    div.innerHTML = value || "";
    return div.textContent || div.innerText || "";
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
    return escapeHtml(value).replaceAll("`", "&#096;");
}

poiSearch.addEventListener("input", () => {
    renderPOIList();
    updateMarkerVisibility();
});

renderLegend();
populateFilters();
renderTerritories();
renderPartyLocation();
renderPCQuests();
renderPOIs();
renderPOIList();
if (DATA.party_location && DATA.party_location.visible !== false) {
    const panelRect = mapPanel.getBoundingClientRect();
    mapPanel.scrollLeft = DATA.party_location.x * zoom - panelRect.width / 2;
    mapPanel.scrollTop = DATA.party_location.y * zoom - panelRect.height / 2;
}
applyZoom();
</script>
</body>
</html>
