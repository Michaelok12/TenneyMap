<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campaign Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #171717;
    color: #222;
}
#app {
    display: flex;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
}
#mapPanel {
    flex: 1;
    overflow: auto;
    background: #202020;
    padding: 18px;
    cursor: grab;
}
#mapPanel.dragging {
    cursor: grabbing;
    user-select: none;
}
#zoomStage {
    position: relative;
    width: 4000px;
    height: 5000px;
    margin: 0 auto;
}
#mapWrap {
    position: absolute;
    left: 0;
    top: 0;
    width: 4000px;
    height: 5000px;
    transform-origin: top left;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}
#mapImg {
    position: absolute;
    left: 0;
    top: 0;
    width: 4000px;
    height: 5000px;
    display: block;
    user-select: none;
    pointer-events: none;
}
#territorySvg {
    position: absolute;
    left: 0;
    top: 0;
    width: 4000px;
    height: 5000px;
    pointer-events: none;
}
.territory-label {
    position: absolute;
    transform: translate(-50%, -50%);
    background: rgba(245,245,245,0.82);
    border: 1px solid rgba(30,30,30,0.65);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    pointer-events: none;
    white-space: nowrap;
}
.poi {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid #222;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 7px rgba(0,0,0,0.55);
    z-index: 10;
}
.poi:hover, .poi.selected {
    outline: 3px solid rgba(255,255,255,0.95);
    z-index: 20;
}
.poi-inner {
    width: 25px;
    height: 25px;
    background: #f5f5f5;
    border: 1px solid #222;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.poi-inner img {
    max-width: 20px;
    max-height: 20px;
}
#infoPanel {
    width: 380px;
    max-width: 40vw;
    background: #f4f1e8;
    border-left: 1px solid #555;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
#detailsPane {
    flex: 1 1 auto;
    min-height: 0;
    padding: 16px;
    overflow-y: auto;
}
#detailsPane h1 {
    font-size: 20px;
    margin: 0 0 8px 0;
}
#detailsPane .meta {
    color: #444;
    font-size: 13px;
    margin-bottom: 12px;
}
#detailsPane .placeholder {
    color: #666;
    font-style: italic;
}
#description {
    line-height: 1.35;
}
#poiBrowser {
    flex: 0 0 33%;
    max-height: 33%;
    min-height: 190px;
    border-top: 1px solid #b6aa96;
    background: #ede7d8;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.browser-title {
    font-weight: bold;
    font-size: 13px;
}
#poiSearch {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 7px;
    border: 1px solid #9a8f7b;
    border-radius: 5px;
    font-size: 12px;
}
.filter-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}
.filter-row select {
    width: 100%;
    padding: 5px;
    border: 1px solid #9a8f7b;
    border-radius: 5px;
    font-size: 12px;
    background: #fffdf8;
}
#poiList {
    flex: 1 1 auto;
    overflow-y: auto;
    border: 1px solid #c3b9a5;
    border-radius: 6px;
    background: rgba(255,255,255,0.55);
}
.poi-list-item {
    padding: 7px 8px;
    border-bottom: 1px solid rgba(150,140,120,0.35);
    cursor: pointer;
    font-size: 12px;
}
.poi-list-item:hover {
    background: rgba(255,255,255,0.85);
}
.poi-list-item.active {
    background: #d7e8ff;
    font-weight: bold;
}
.poi-list-title {
    display: block;
    font-weight: 700;
}
.poi-list-meta {
    color: #555;
    font-size: 11px;
}
#poiCount {
    font-size: 11px;
    color: #555;
}
#controls {
    position: fixed;
    left: 16px;
    top: 16px;
    background: rgba(245,245,245,0.90);
    border: 1px solid rgba(30,30,30,0.55);
    border-radius: 8px;
    padding: 8px;
    display: flex;
    gap: 6px;
    align-items: center;
    z-index: 100;
}
#controls button {
    border: 1px solid #444;
    background: #fff;
    border-radius: 5px;
    padding: 5px 9px;
    cursor: pointer;
    font-weight: bold;
}
#zoomLabel {
    min-width: 48px;
    text-align: center;
    font-size: 12px;
}
.legend {
    position: fixed;
    left: 16px;
    bottom: 16px;
    background: rgba(245,245,245,0.90);
    border: 1px solid rgba(30,30,30,0.55);
    border-radius: 8px;
    padding: 10px;
    font-size: 12px;
    max-width: 460px;
    z-index: 100;
}
.legend-title {
    font-weight: bold;
    margin: 0 0 4px 0;
}
.legend-grid {
    display: grid;
    grid-template-columns: repeat(3, max-content);
    column-gap: 14px;
    row-gap: 4px;
    margin-bottom: 8px;
}
.legend-factions {
    display: grid;
    grid-template-columns: repeat(4, max-content);
    column-gap: 14px;
    row-gap: 4px;
}
.legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
}
.legend-item img {
    width: 18px;
    height: 18px;
    object-fit: contain;
}
.color-dot {
    font-size: 16px;
    line-height: 1;
}
</style>
</head>
<body>
<div id="app">
    <div id="mapPanel">
        <div id="zoomStage">
            <div id="mapWrap">
                <img id="mapImg" alt="Campaign map">
                <svg id="territorySvg" viewBox="0 0 4000 5000" preserveAspectRatio="none"></svg>
            </div>
        </div>
    </div>
    <aside id="infoPanel">
        <div id="detailsPane">
            <h1>Map Information</h1>
            <p class="placeholder">Click a marker or choose a POI from the list.</p>
        </div>
        <div id="poiBrowser">
            <div class="browser-title">POIs</div>
            <input id="poiSearch" type="search" placeholder="Search POIs...">
            <div class="filter-row">
                <select id="categoryFilter"></select>
                <select id="factionFilter"></select>
            </div>
            <div id="poiList"></div>
            <div id="poiCount"></div>
        </div>
    </aside>
</div>

<div id="controls">
    <button type="button" onclick="zoomOut()">−</button>
    <span id="zoomLabel">100%</span>
    <button type="button" onclick="zoomIn()">+</button>
    <button type="button" onclick="resetZoom()">Reset</button>
</div>

<div class="legend">
    <div class="legend-title">Categories</div>
    <div id="categoryLegend" class="legend-grid"></div>
    <div class="legend-title">Faction Colors</div>
    <div id="factionLegend" class="legend-factions"></div>
</div>

const mapPanel = document.getElementById("mapPanel");
const zoomStage = document.getElementById("zoomStage");
const mapImg = document.getElementById("mapImg");
const mapWrap = document.getElementById("mapWrap");
const territorySvg = document.getElementById("territorySvg");
const detailsPane = document.getElementById("detailsPane");
const zoomLabel = document.getElementById("zoomLabel");
const categoryLegend = document.getElementById("categoryLegend");
const factionLegend = document.getElementById("factionLegend");
const poiSearch = document.getElementById("poiSearch");
const categoryFilter = document.getElementById("categoryFilter");
const factionFilter = document.getElementById("factionFilter");
const poiList = document.getElementById("poiList");
const poiCount = document.getElementById("poiCount");

let zoom = 1.0;
let dragging = false;
let dragStartX = 0;
let dragStartY = 0;
let scrollStartLeft = 0;
let scrollStartTop = 0;
let selectedPoiId = null;
const markerById = new Map();

mapImg.src = DATA.mapImage;
territorySvg.setAttribute("viewBox", `0 0 ${DATA.mapWidth} ${DATA.mapHeight}`);

function pctX(x) {
    return (x / DATA.mapWidth * 100).toFixed(5) + "%";
}

function pctY(y) {
    return (y / DATA.mapHeight * 100).toFixed(5) + "%";
}

function applyZoom(anchorClientX = null, anchorClientY = null, previousZoom = zoom) {
    let anchorMapX = null;
    let anchorMapY = null;

    if (anchorClientX !== null && anchorClientY !== null) {
        const panelRect = mapPanel.getBoundingClientRect();
        anchorMapX = (mapPanel.scrollLeft + anchorClientX - panelRect.left) / previousZoom;
        anchorMapY = (mapPanel.scrollTop + anchorClientY - panelRect.top) / previousZoom;
    }

    mapWrap.style.transform = `scale(${zoom})`;
    zoomStage.style.width = `${DATA.mapWidth * zoom}px`;
    zoomStage.style.height = `${DATA.mapHeight * zoom}px`;
    zoomLabel.textContent = `${Math.round(zoom * 100)}%`;

    if (anchorMapX !== null && anchorMapY !== null) {
        const panelRect = mapPanel.getBoundingClientRect();
        mapPanel.scrollLeft = anchorMapX * zoom - (anchorClientX - panelRect.left);
        mapPanel.scrollTop = anchorMapY * zoom - (anchorClientY - panelRect.top);
    }
}

function setZoom(newZoom, anchorClientX = null, anchorClientY = null) {
    const previousZoom = zoom;
    zoom = Math.max(0.35, Math.min(4.0, newZoom));
    applyZoom(anchorClientX, anchorClientY, previousZoom);
}

function zoomIn() {
    setZoom(zoom + 0.20, window.innerWidth / 2, window.innerHeight / 2);
}

function zoomOut() {
    setZoom(zoom - 0.20, window.innerWidth / 2, window.innerHeight / 2);
}

function resetZoom() {
    setZoom(1.0, window.innerWidth / 2, window.innerHeight / 2);
}

mapPanel.addEventListener("wheel", function(event) {
    if (!event.ctrlKey) return;
    event.preventDefault();
    if (event.deltaY < 0) setZoom(zoom + 0.15, event.clientX, event.clientY);
    else setZoom(zoom - 0.15, event.clientX, event.clientY);
}, { passive: false });

mapPanel.addEventListener("mousedown", function(event) {
    if (event.button !== 0) return;
    if (event.target.closest(".poi")) return;

    dragging = true;
    dragStartX = event.clientX;
    dragStartY = event.clientY;
    scrollStartLeft = mapPanel.scrollLeft;
    scrollStartTop = mapPanel.scrollTop;
    mapPanel.classList.add("dragging");
    event.preventDefault();
});

window.addEventListener("mousemove", function(event) {
    if (!dragging) return;
    const dx = event.clientX - dragStartX;
    const dy = event.clientY - dragStartY;
    mapPanel.scrollLeft = scrollStartLeft - dx;
    mapPanel.scrollTop = scrollStartTop - dy;
});

window.addEventListener("mouseup", function() {
    dragging = false;
    mapPanel.classList.remove("dragging");
});

function renderLegend() {
    DATA.categories.forEach(c => {
        const item = document.createElement("div");
        item.className = "legend-item";

        if (c.icon) {
            const img = document.createElement("img");
            img.src = c.icon;
            img.alt = c.name;
            item.appendChild(img);
        } else {
            const fallback = document.createElement("span");
            fallback.textContent = "◆";
            item.appendChild(fallback);
        }

        const text = document.createElement("span");
        text.textContent = c.name;
        item.appendChild(text);
        categoryLegend.appendChild(item);
    });

    DATA.factions.forEach(f => {
        const item = document.createElement("div");
        item.className = "legend-item";

        const dot = document.createElement("span");
        dot.className = "color-dot";
        dot.textContent = "●";
        dot.style.color = f.color;
        item.appendChild(dot);

        const text = document.createElement("span");
        text.textContent = f.name;
        item.appendChild(text);

        factionLegend.appendChild(item);
    });
}

function populateFilters() {
    const categoryNames = ["All Categories", ...DATA.categories.map(c => c.name)];
    categoryFilter.innerHTML = categoryNames.map(name => `<option value="${escapeAttr(name)}">${escapeHtml(name)}</option>`).join("");

    const factionNames = ["All Factions", ...DATA.factions.map(f => f.name)];
    factionFilter.innerHTML = factionNames.map(name => `<option value="${escapeAttr(name)}">${escapeHtml(name)}</option>`).join("");
}

function renderTerritories() {
    DATA.territories.forEach(t => {
        const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        polygon.setAttribute("points", t.points.map(p => `${p[0]},${p[1]}`).join(" "));
        polygon.setAttribute("fill", t.fill);
        polygon.setAttribute("stroke", t.color);
        polygon.setAttribute("stroke-width", "2");
        territorySvg.appendChild(polygon);

        const label = document.createElement("div");
        label.className = "territory-label";
        label.style.left = pctX(t.centroid[0]);
        label.style.top = pctY(t.centroid[1]);
        label.innerHTML = `${escapeHtml(t.title)}<br><span style="font-weight:500">${escapeHtml(t.faction)}</span>`;
        mapWrap.appendChild(label);
    });
}

function renderPOIs() {
    DATA.pois.forEach(p => {
        const marker = document.createElement("button");
        marker.className = "poi";
        marker.dataset.poiId = p.id;
        marker.style.left = pctX(p.x);
        marker.style.top = pctY(p.y);
        marker.style.background = p.color;
        marker.title = `${p.title}\n${p.category} | ${p.faction}`;

        const inner = document.createElement("span");
        inner.className = "poi-inner";

        if (p.icon) {
            const img = document.createElement("img");
            img.src = p.icon;
            img.alt = p.category;
            inner.appendChild(img);
        } else {
            inner.textContent = "◆";
        }

        marker.appendChild(inner);
        marker.addEventListener("click", () => selectPOI(p, true));
        markerById.set(p.id, marker);
        mapWrap.appendChild(marker);
    });
}

function filteredPOIs() {
    const searchText = poiSearch.value.trim().toLowerCase();
    const categoryValue = categoryFilter.value;
    const factionValue = factionFilter.value;

    return DATA.pois.filter(p => {
        const haystack = `${p.title} ${p.description} ${p.category} ${p.faction}`.toLowerCase();
        if (searchText && !haystack.includes(searchText)) return false;
        if (categoryValue !== "All Categories" && p.category !== categoryValue) return false;
        if (factionValue !== "All Factions" && p.faction !== factionValue) return false;
        return true;
    });
}

function renderPOIList() {
    const pois = filteredPOIs();
    poiList.innerHTML = "";

    pois.forEach(p => {
        const item = document.createElement("div");
        item.className = "poi-list-item" + (p.id === selectedPoiId ? " active" : "");
        item.innerHTML = `
            <span class="poi-list-title">${escapeHtml(p.title)}</span>
            <span class="poi-list-meta">${escapeHtml(p.category)} | ${escapeHtml(p.faction)}</span>
        `;
        item.addEventListener("click", () => selectPOI(p, true));
        poiList.appendChild(item);
    });

    poiCount.textContent = `Showing ${pois.length} of ${DATA.pois.length} POIs`;
}

function selectPOI(p, centerMap = false) {
    selectedPoiId = p.id;

    markerById.forEach(marker => marker.classList.remove("selected"));
    const marker = markerById.get(p.id);
    if (marker) marker.classList.add("selected");

    showPOI(p);
    renderPOIList();

    if (centerMap) {
        const panelRect = mapPanel.getBoundingClientRect();
        mapPanel.scrollLeft = p.x * zoom - panelRect.width / 2;
        mapPanel.scrollTop = p.y * zoom - panelRect.height / 2;
    }
}

function showPOI(p) {
    detailsPane.innerHTML = `
        <h1>${escapeHtml(p.title)}</h1>
        <div class="meta">
            <strong>Category:</strong> ${escapeHtml(p.category)}<br>
            <strong>Faction:</strong> ${escapeHtml(p.faction)}
        </div>
        <div id="description">${p.description || "<em>No description.</em>"}</div>
    `;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
    return escapeHtml(value).replaceAll("`", "&#096;");
}

poiSearch.addEventListener("input", renderPOIList);
categoryFilter.addEventListener("change", renderPOIList);
factionFilter.addEventListener("change", renderPOIList);

renderLegend();
populateFilters();
renderTerritories();
renderPOIs();
renderPOIList();
applyZoom();
</script>
</body>
